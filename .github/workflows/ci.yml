# PROTECTED FILE — docs/GUARDRAILS.md GR-11, GR-12, GR-14. Same gate as local `npm run verify`.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # GR-11: check · lint · guard · all tests. tests/run.js fails if the suite takes over 120 s on CI (GRH-063).
      - run: npm run verify
      # GR-14: every commit that changes extension/ names a requirement from a spec approved in an earlier commit.
      - name: Spec-first check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="${{ github.event.pull_request.base.sha }}"; else BASE="${{ github.event.before }}"; fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=$(git rev-list --max-parents=0 HEAD | tail -1); fi
          node scripts/spec-check.js --range "$BASE" "${{ github.sha }}"
      # GRH-015: changing a protected-file fingerprint needs the guardrail-change label on the PR.
      - name: Guardrail-change label
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | grep -qx "scripts/guardrails.lock.json"; then
            if ! echo '${{ toJson(github.event.pull_request.labels.*.name) }}' | grep -q '"guardrail-change"'; then
              echo "::error::scripts/guardrails.lock.json changed: a protected guardrail file was edited. Add the 'guardrail-change' label after reviewing it (GRH-015)."; exit 1
            fi
          fi

  # GR-12 / GRH-052: every known mistake in scripts/mutants.json must be caught.
  mutate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run mutate
